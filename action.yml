name: spillage
description: Find agent transcripts (SpecStory, Aider, Claude Code, Codex...) committed to the repo, and the API keys inside them
author: maximilianfeix
branding:
  icon: droplet
  color: red

inputs:
  path:
    description: Repository folder to check
    default: "."
  strict:
    description: Fail on any committed agent transcript, not only on ones with secrets in them
    default: "false"
  all-files:
    description: Scan every tracked file for secrets, not just agent transcripts
    default: "false"
  sarif:
    description: Also write a SARIF report to this path, for github/codeql-action/upload-sarif
    default: ""

outputs:
  transcripts:
    description: Number of committed agent transcripts
    value: ${{ steps.run.outputs.transcripts }}
  secrets:
    description: Number of distinct secrets found
    value: ${{ steps.run.outputs.secrets }}
  sarif:
    description: Path of the SARIF report, if one was asked for
    value: ${{ inputs.sarif }}

runs:
  using: composite
  steps:
    - name: Install spillage
      shell: bash
      run: |
        base=$(command -v python3 || command -v python)
        "$base" -m venv "$RUNNER_TEMP/spillage-venv"
        py="$RUNNER_TEMP/spillage-venv/bin/python"
        [ -x "$py" ] || py="$RUNNER_TEMP/spillage-venv/Scripts/python.exe"
        "$py" -m pip install --quiet --disable-pip-version-check "${{ github.action_path }}"
        echo "SPILLAGE_PY=$py" >> "$GITHUB_ENV"
    - id: run
      name: Check the repository
      shell: bash
      env:
        SPILLAGE_PATH: ${{ inputs.path }}
        SPILLAGE_STRICT: ${{ inputs.strict }}
        SPILLAGE_ALL: ${{ inputs.all-files }}
        SPILLAGE_SARIF: ${{ inputs.sarif }}
      run: |
        args=(repo "$SPILLAGE_PATH" --format github)
        [ "$SPILLAGE_STRICT" = "true" ] && args+=(--strict)
        [ "$SPILLAGE_ALL" = "true" ] && args+=(--all-files)
        [ -n "$SPILLAGE_SARIF" ] && args+=(--sarif "$SPILLAGE_SARIF")
        "$SPILLAGE_PY" -m spillage "${args[@]}"
