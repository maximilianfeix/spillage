name: release

# Pushing a tag like v0.7.0 builds the package, checks that the tag matches the version in the
# code, publishes a GitHub release with that version's section of the changelog, and uploads
# the same files to PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # PyPI shows the README without the repository behind it: images and links have to be absolute
      - name: The README for PyPI
        run: python .github/pypi_readme.py "$GITHUB_REF_NAME"

      - name: Build
        run: |
          pip install --quiet build twine
          python -m build
          twine check --strict dist/*

      - name: The tag matches the version
        run: |
          pip install --quiet dist/*.whl
          version=$(spillage --version | cut -d' ' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but spillage says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release notes from the changelog
        run: python .github/release_notes.py "$VERSION" > notes.md

      # `gh attestation verify <file> --repo maximilianfeix/spillage` proves a file was built here
      - name: Attest the build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Trusted publishing: PyPI accepts the upload because it comes from this workflow in this
  # repository, so there is no API token stored anywhere.
  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/spillage/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
