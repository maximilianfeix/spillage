[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spillage"
dynamic = ["version"]
description = "Keep API keys out of your coding agents: hooks that block the leak in Claude Code, Codex and Gemini CLI, a scan for what already leaked in the logs of 13 agents, and a scrub."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maximilian Feix" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["secrets", "secret-scanner", "claude-code", "codex", "gemini-cli", "ai-agents", "security", "api-keys", "credentials", "redaction", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff==0.16.9"]

[project.scripts]
spillage = "spillage.cli:entry"

[project.urls]
Homepage = "https://maximilianfeix.github.io/spillage/"
Documentation = "https://github.com/maximilianfeix/spillage#readme"
Repository = "https://github.com/maximilianfeix/spillage"
Issues = "https://github.com/maximilianfeix/spillage/issues"
Changelog = "https://github.com/maximilianfeix/spillage/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/maximilianfeix/spillage/releases"
Security = "https://github.com/maximilianfeix/spillage/security/policy"

[tool.setuptools.dynamic]
version = { attr = "spillage.__version__" }

[tool.setuptools.packages.find]
include = ["spillage*"]

[tool.setuptools.package-data]
spillage = ["assets/*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP006", "UP007", "UP035", "UP045", "RUF001", "RUF002", "RUF003", "RUF012", "RUF005", "SIM105", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# the image generators are mostly SVG markup
"docs/*.py" = ["E501"]
